[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kush-agent"
version = "0.1.0"
description = "Cloud autonomous computer-agent platform: external AI models control Kush OS (and other guests) running in QEMU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
dependencies = [
  "pillow>=10",
  "pyyaml>=6",
  "httpx>=0.27",
  "anthropic>=0.70",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kush-agent = "kush_agent.cli:main"

[tool.setuptools.packages.find]
include = ["kush_agent*"]

[tool.setuptools.package-data]
kush_agent = ["admin/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs qemu-system-x86_64 installed"]
