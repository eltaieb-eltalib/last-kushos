<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة Kush Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="card login-card">
    <div class="brand"><span class="logo">ك</span><div><b>Kush Agent</b><small>لوحة الإدارة</small></div></div>
    <label>كلمة المرور<input type="password" id="password" autocomplete="current-password" required autofocus></label>
    <button class="btn primary" type="submit">دخول</button>
    <p class="err" id="login-err"></p>
  </form>
</div>

<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="brand"><span class="logo">ك</span><div><b>Kush Agent</b><small>لوحة الإدارة</small></div></div>
    <nav id="nav">
      <a href="#/" data-v="overview">نظرة عامة</a>
      <a href="#/vms" data-v="vms">الأجهزة</a>
      <a href="#/runs" data-v="runs">المهام</a>
      <a href="#/approvals" data-v="approvals">الموافقات <span id="badge" class="badge" hidden></span></a>
      <a href="#/models" data-v="models">النماذج والإعدادات</a>
    </nav>
    <div class="side-foot">
      <button class="btn ghost" id="theme" type="button" aria-label="تبديل الوضع الليلي">الوضع</button>
      <button class="btn ghost" id="logout" type="button">خروج</button>
    </div>
  </aside>
  <main id="view" class="main" tabindex="-1"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
